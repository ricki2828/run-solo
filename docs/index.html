<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Supreme</title>
<meta name="description" content="Run Supreme: a 4x4 interval timer with GPS pace that tells you if you beat your last run.">
<style>
  :root { --bg:#0b0b0c; --ink:#ece7dc; --mute:#9c978d; --accent:#2fd7e6; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f3ec; --ink:#141414; --mute:#5c5a55; --accent:#0a8f9c; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:680px; margin:0 auto; padding:72px 16px; }
  h1 { font-size:2.4rem; margin:0 0 8px; letter-spacing:-0.01em; }
  p { margin:0 0 16px; }
  .mute { color:var(--mute); }
  a { color:var(--accent); text-underline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>Run Supreme</h1>
  <p>A 4x4 interval timer with GPS pace. Tells you, in one word, if you beat your last run.</p>
  <p class="mute">Android. No account. No feed. No ads. Your runs stay on your phone.</p>
  <p><a href="privacy/">Privacy policy</a></p>
</main>
</body>
</html>
