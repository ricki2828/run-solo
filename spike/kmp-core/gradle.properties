# CI (macOS runner, 7 GB) needs the heap for Kotlin/Native linking; the aarch64 host runs only
# jvmTest and overrides this with -Dorg.gradle.jvmargs on the command line.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx512m
kotlin.compiler.execution.strategy=in-process
# Apple targets are declared but cannot build on Linux; skip them there instead of failing.
kotlin.native.ignoreDisabledTargets=true
