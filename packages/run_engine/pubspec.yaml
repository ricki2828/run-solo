name: run_engine
description: Pure-Dart analysis engine for Run Solo (laps, trimming, metrics, staged verdict, plan schedule). No Flutter, no I/O.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  xml: ^6.5.0
  # Zone rules (10-year database) for the offset at a run's start; the lat/lon
  # to zone lookup is our own coarse grid (lib/src/engine/zone_grid.dart).
  timezone: ^0.11.1

dev_dependencies:
  # Only tool/gen_zone_grid.dart (builds the shipped coarse zone grid).
  timezone_finder: ^0.2.0
  lints: ^6.0.0
  test: ^1.25.0
  coverage: ^1.15.0
