name: run_engine
description: Pure-Dart analysis engine for Run Solo (laps, trimming, metrics, staged verdict, plan schedule). No Flutter, no I/O.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  xml: ^6.5.0
  # Offline lat/lon -> IANA zone (boundary polygons compiled in) and the zone
  # rules, so a run's time of day is the wall clock where it started.
  timezone: ^0.11.1
  timezone_finder: ^0.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  coverage: ^1.15.0
