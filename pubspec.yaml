name: run_solo
description: "Run Supreme: 4x4 Interval Run. Local-only Android running app with a staged 4x4 verdict."
publish_to: 'none'

# versionCode comes from the +N suffix (plan §11 release train).
version: 0.1.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  run_engine:
    path: packages/run_engine
  # App files dir (settings sidecar, run files).
  path_provider: ^2.1.5
  # sha256 of downloaded offline map packs (pure Dart, already in the lock).
  crypto: ^3.0.7
  # Post-run route map (plan §18.3). The only network user besides Phase 3's
  # weather client. Sits behind `MapSurface`; tests never construct it.
  google_maps_flutter: ^2.10.0
  # Offline Topo maps: second map engine (PMTiles from disk), see lib/map/topo_map_surface.dart.
  maplibre_gl: ^0.27.1
  # Move runs between Run Supreme installs (dogfood → Play, plan §4 import): the
  # share sheet writes RunBundle JSON files, SAF picks them back. No network.
  share_plus: ^11.0.0
  file_selector: ^1.0.3
  # Send runs: "Open Strava upload page" opens the browser (no other network use).
  url_launcher: ^6.3.0
  # Send runs: the Intervals.icu API key, in the Android Keystore (never in settings or backups).
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.0.0

flutter:
  uses-material-design: true
  # iOS plugins come through CocoaPods only. google_maps_flutter_ios ships no Package.swift,
  # so leaving Swift Package Manager on would mix SPM and CocoaPods in one Xcode project.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/maps/night_session.json
    - assets/maps/night_session_card.json
    - assets/maps/aurora_topo.json
    # Glyphs the offline Topo map's labels need (Noto Sans, OFL); copied to the files dir on first use.
    - assets/topo/glyphs/
    - assets/topo/glyphs/NotoSans/
    - assets/plans/
    - assets/fonts/OFL-SairaExtraCondensed.txt
    - assets/fonts/OFL-SchibstedGrotesk.txt
    # Splash runner photograph (Unsplash license, assets/brand/splash_runner.LICENSE.txt).
    - assets/brand/splash_runner.jpg

  # Fonts are bundled (OFL, see assets/fonts/OFL-*.txt). Nothing is fetched at runtime:
  # the app has no network code (plan §2 rule 4).
  fonts:
    - family: Saira Extra Condensed
      fonts:
        - asset: assets/fonts/SairaExtraCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/SairaExtraCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/SairaExtraCondensed-ExtraBold.ttf
          weight: 800
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Variable.ttf
