name: topo-spike
# T0 spike only (draft PR, never merged): proves MapLibre + PMTiles beside Google Maps.
on:
  push:
    branches: [topo-t0-spike]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.5'
  # maplibre_gl's Android module targets Java 21 (JDK 17 fails: "invalid source release: 21").
  JAVA_VERSION: '21'

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build spike APK (debug, x86_64, play flavour)
        run: |
          flutter build apk --debug --flavor play --target-platform android-x64 \
            -t lib/topo_spike_main.dart --dart-define=RUN_SOLO_MAPS_API_KEY=${{ secrets.RUN_SOLO_MAPS_API_KEY }}
          mkdir -p build/dist && cp build/app/outputs/flutter-apk/app-play-debug.apk build/dist/spike.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Spike on emulator (API 34, offline)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: tools/emulator_topo_spike.sh build/dist/spike.apk app.runsolo.debug
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: topo-spike
          path: topo-spike
          retention-days: 14
