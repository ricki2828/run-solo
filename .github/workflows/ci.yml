name: ci

# CI diet (the repo is private, Actions minutes are metered; macOS costs 10x).
# - PR push: analyze + test, core-jvm, debug APK (+ lint, unit tests, 16 KB check), brand + topo
#   checks. Docs-only and *.md changes run nothing.
# - Push to main: analyze + test, core-jvm, brand + topo checks and the dogfood APK build. No
#   emulator minutes per merge; the dogfood R8 build is smoked on API 36 in the nightly.
# - Nightly (02:00 UTC, main only, skipped when main has no commit in the last 25 h): the debug APK
#   plus a rotated slice of the emulator work to fit the GitHub-hosted budget: smoke on API 36
#   and on 34 or 29 on alternate days, and 4 of the 13 replay kinds by day of year (every kind
#   every 3-4 days). Tags, workflow_dispatch and PRs labelled `full-ci` run the whole set:
#   smoke 29/34/36 and all 13 replays. The release AAB runs on tags and dispatch only;
#   topo-surface.yml on tags, dispatch and `full-ci` only.
# - Kotlin/Native on macOS: only when android/core-jvm, ios or pigeons changed, on main, with
#   `full-ci`, tags or dispatch. Never on the nightly or on Flutter-only PRs.
# Adding any label other than `full-ci` re-triggers the workflow; every job skips itself then.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['docs/**', '**.md']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  # Label noise gets its own group so an unrelated label cannot cancel a real run.
  group: ci-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && 'label' || 'run' }}
  # Pushes to main and tags always finish: every main sha keeps its dogfood APK.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to the same stable the dev host runs (~/tools/flutter). Bump both together.
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '21'

jobs:
  changes:
    # Decides whether the Kotlin/Native job (macOS minutes) runs: only when the shared core,
    # iOS or the Pigeon contract changed (PRs by their diff, main pushes by the pushed range,
    # anything else always). Only runs at all when the heavy set does. If this job fails, the
    # native job runs instead of skipping.
    name: which paths changed
    if: ${{ !(github.event.action == 'labeled' && github.event.label.name != 'full-ci') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      core: ${{ steps.diff.outputs.core }}
      nightly: ${{ steps.diff.outputs.nightly }}
      smoke_apis: ${{ steps.diff.outputs.smoke_apis }}
      replay_kinds: ${{ steps.diff.outputs.replay_kinds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          # core: the Kotlin/Native job (macOS minutes) runs only when the shared core or this
          # workflow changed: PRs by their diff, main pushes by the pushed range, else always.
          core_re='^(android/core-jvm/|ios/|pigeons/)'
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE...$HEAD"
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$SHA"
          else
            range=""
          fi
          # nightly: the 02:00 UTC schedule runs only when the main head commit is under 25 h old.
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$EVENT" != "schedule" ] || [ "$age" -lt 90000 ]; then
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          else
            echo "nightly=false" >> "$GITHUB_OUTPUT"; echo "main unchanged for $age s: nightly skipped"
          fi
          # Emulator matrices. Nightly rotates to fit the GitHub-hosted minute budget: API 36 every
          # night plus 34 or 29 on alternate days, and 4 of the 13 replay kinds by day of year
          # (each kind every 3-4 days). Tags, dispatch and full-ci run everything.
          if [ "$EVENT" = "schedule" ]; then
            doy=$((10#$(date -u +%j)))
            if [ $((doy % 2)) -eq 0 ]; then alt=34; else alt=29; fi
            echo "smoke_apis=[36, $alt]" >> "$GITHUB_OUTPUT"
            python3 - "$doy" >> "$GITHUB_OUTPUT" <<'PYCODE'
          import json, sys
          kinds = ["4x4", "400s", "30-30s", "yasso-800s", "1km-repeats", "fartlek", "cooper", "parkrun", "goal-10k", "goal-30min", "pause-end", "auto-pause", "t4"]
          start = (int(sys.argv[1]) * 4) % len(kinds)
          print("replay_kinds=" + json.dumps([kinds[(start + i) % len(kinds)] for i in range(4)]))
          PYCODE
          else
            echo "smoke_apis=[29, 34, 36]" >> "$GITHUB_OUTPUT"
            echo 'replay_kinds=["4x4", "400s", "30-30s", "yasso-800s", "1km-repeats", "fartlek", "cooper", "parkrun", "goal-10k", "goal-30min", "pause-end", "auto-pause", "t4"]' >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT" = "schedule" ]; then
            echo "core=false" >> "$GITHUB_OUTPUT"; echo "schedule: Kotlin/Native never runs nightly"
          elif [ -z "$range" ] || git diff --name-only "$range" | grep -qE "$core_re"; then
            echo "core=true" >> "$GITHUB_OUTPUT"; echo "core changed (or not a diffable event): Kotlin/Native job runs"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"; echo "core unchanged: Kotlin/Native job skipped"
          fi

  flutter:
    name: analyze + test (app, run_engine)
    if: ${{ !(github.event.action == 'labeled' && github.event.label.name != 'full-ci') && github.event_name != 'schedule' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: run_engine deps (flutter analyze from the root also analyzes the package)
        working-directory: packages/run_engine
        run: dart pub get
      - name: Pigeon output is committed and current
        run: |
          dart run pigeon --input pigeons/platform_api.dart
          git diff --exit-code -- lib/platform android/app/src/main/kotlin/app/runsolo/platform ios/Runner/PlatformApi.g.swift
      - name: Format
        # Generated Pigeon output is excluded: it is checked for drift above, not formatted.
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/main.dart lib/screens lib/theme lib/platform/platform.dart test pigeons packages/run_engine
      - name: Event names come from the flavour config (K1 trademark rule)
        run: python3 tools/check_event_names.py
      - name: Analyze
        run: flutter analyze
      - name: App tests
        run: flutter test
      - name: run_engine tests
        working-directory: packages/run_engine
        run: dart test
      - name: Render goldens (artifact; commit into test/golden/goldens to enable the golden tests)
        # The aarch64 dev host cannot render them; this Linux runner is the
        # reference. Never fails the job, and still runs when a golden test
        # failed (that is when the fresh PNG is needed).
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          mkdir -p test/golden/goldens
          flutter test --update-goldens test/golden
      - name: Collect changed and new goldens only (the full set is ~36 MB; artifact quota is 500 MB)
        if: ${{ failure() }}
        run: |
          mkdir -p golden-changed
          git ls-files --modified --others --exclude-standard -- test/golden/goldens | while read -r f; do
            rel="${f#test/golden/goldens/}"
            mkdir -p "golden-changed/$(dirname "$rel")"
            cp "$f" "golden-changed/$rel"
          done
          du -sh golden-changed
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: goldens
          path: golden-changed
          if-no-files-found: ignore
          retention-days: 3
      - name: Kotlin→Dart contract fixtures are identical copies
        # core-jvm writes the top-level (schema 3) files from the real recording
        # path; schema1/ and schema2/ are frozen older output (plan §18.7,
        # Phase 3 §3.8). run_engine
        # tests both. A drift on either side, or an empty directory, fails here
        # (review P1-4).
        run: |
          kotlin=android/core-jvm/src/test/fixtures/contract
          dart=packages/run_engine/test/fixtures/contract
          for dir in "$kotlin" "$kotlin/schema1" "$kotlin/schema2"; do
            count=$(ls "$dir"/*.json 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::no Kotlin contract fixtures in $dir"; exit 1
            fi
            echo "contract fixtures: $count files in $dir"
          done
          diff -r "$kotlin" "$dart"
          echo "contract fixtures identical to run_engine copies (both ways)"
      - name: Kotlin→Dart event-trace fixtures are identical copies
        # EventChannel traces (RecorderEvent + status snapshots) for the Dart controller test;
        # a separate dir so the run-file contract test never sees them.
        run: |
          kotlin=android/core-jvm/src/test/fixtures/contract-events
          dart=packages/run_engine/test/fixtures/contract-events
          count=$(ls "$kotlin"/*.ndjson 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no Kotlin event-trace fixtures in $kotlin"; exit 1
          fi
          diff -r "$kotlin" "$dart"
          echo "event-trace fixtures: $count Kotlin files identical to run_engine copies (both ways)"

  brand:
    name: brand vectors are current
    if: ${{ !(github.event.action == 'labeled' && github.event.label.name != 'full-ci') && github.event_name != 'schedule' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r assets/brand/requirements.txt
      - name: Regenerate and diff (vectors only; PNG antialiasing may differ by platform)
        run: |
          python assets/brand/build_brand.py
          # status, not diff: a new file the generator writes is untracked and
          # git diff would miss it.
          drift=$(git status --porcelain -- assets/brand/svg android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 lib/brand)
          if [ -n "$drift" ]; then echo "Brand vectors drifted; run build_brand.py and commit:"; echo "$drift"; git diff --stat; exit 1; fi

  topo-style:
    name: topo style is current and valid
    if: ${{ !(github.event.action == 'labeled' && github.event.label.name != 'full-ci') && github.event_name != 'schedule' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Style matches tokens and run colours keep 3:1 against the map
        run: python3 tools/topo/build_style.py --check
      - name: MapLibre style-spec validator
        run: npx --yes -p @maplibre/maplibre-gl-style-spec@26.4.4 gl-style-validate assets/maps/aurora_topo.json

  core-jvm:
    name: core-jvm tests (pure Kotlin)
    if: ${{ !(github.event.action == 'labeled' && github.event.label.name != 'full-ci') && github.event_name != 'schedule' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: android/core-jvm
        run: ./gradlew jvmTest --no-daemon
      - name: Regenerate fixtures; any drift is uploaded (fixtures are never hand-edited)
        if: ${{ !cancelled() }}
        working-directory: android/core-jvm
        run: |
          ./gradlew regenerateFixtures --no-daemon
          cd ../..
          drift=$(git status --porcelain --untracked-files=all -- android/core-jvm/src/test/fixtures packages/run_engine/test/fixtures)
          if [ -n "$drift" ]; then
            echo "::error::generated fixtures differ from the checked-in files; download the regenerated-fixtures artifact and commit it:"
            echo "$drift"
            mkdir -p /tmp/regen
            git status --porcelain -z --untracked-files=all -- android/core-jvm/src/test/fixtures packages/run_engine/test/fixtures | tr '\0' '\n' | cut -c4- | xargs -r -I{} cp --parents {} /tmp/regen/
            echo "drift=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.drift == '1' }}
        with:
          name: regenerated-fixtures
          path: /tmp/regen
          retention-days: 3
      - name: Fail on fixture drift
        if: ${{ !cancelled() && env.drift == '1' }}
        run: exit 1

  core-native:
    # The shared recorder core (Kotlin Multiplatform, plan K1) on Kotlin/Native: the common tests,
    # every contract fixture byte for byte included, on macosArm64 and the iOS simulator. The JVM
    # compile of common code accepts JVM-only stdlib calls; only a Native compile catches them.
    name: core on Kotlin/Native (macOS + iOS simulator)
    needs: changes
    if: ${{ !cancelled() && !(github.event.action == 'labeled' && github.event.label.name != 'full-ci') && github.event_name != 'schedule' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (needs.changes.result != 'success' || needs.changes.outputs.core == 'true') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # restore + save, not actions/cache: its post step skips the save when the job fails.
      - name: Kotlin/Native toolchain cache
        id: konan
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-2.4.0 # bump with Kotlin in core-jvm/build.gradle.kts
      - name: Native tests
        working-directory: android/core-jvm
        run: |
          # Newest iPhone simulator on the image (the Gradle default device name may not exist).
          sim=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((r, x["name"]) for r, xs in d.items() if "iOS" in r for x in xs if x["name"].startswith("iPhone"))
          print(ios[-1][1] if ios else "")')
          echo "simulator: $sim"
          ./gradlew macosArm64Test iosSimulatorArm64Test --no-daemon --continue "-Pcore.simDevice=$sim"
      - name: Save Kotlin/Native toolchain
        if: ${{ !cancelled() && steps.konan.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-2.4.0 # bump with Kotlin in core-jvm/build.gradle.kts
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: core-native-test-reports
          path: android/core-jvm/build/reports/tests/
          retention-days: 3

  build-apk:
    name: build debug APK + 16 KB check
    needs: changes
    if: ${{ !cancelled() && !(github.event.action == 'labeled' && github.event.label.name != 'full-ci') && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && (github.event_name != 'schedule' || needs.changes.outputs.nightly == 'true') }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      # Google Maps key (plan §18.3): manifest placeholder via build.gradle.kts and the same value
      # as --dart-define (String.fromEnvironment) so the app knows whether a map can load. Empty
      # when the secret is absent: the build still passes and the map shows its failed state.
      # Scoped to the jobs that build the app, never printed (do not add `flutter -v` or
      # `--info`: Flutter forwards dart-defines to Gradle base64-encoded, which GitHub cannot mask).
      RUN_SOLO_MAPS_API_KEY: ${{ secrets.RUN_SOLO_MAPS_API_KEY }}
      MAPS_DEFINE: --dart-define=RUN_SOLO_MAPS_API_KEY=${{ secrets.RUN_SOLO_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (the image's disk filled up; df before and after)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build debug APK (play flavour, app.runsolo.debug)
        run: |
          # Live compare ON (founder 28-Sep): LV2's in-app "Mute tips" shipped in #77,
          # the gate live_context.dart waits for. Emulator runs have no history, so
          # compare plans stay empty there.
          flutter build apk --debug --flavor play $MAPS_DEFINE --dart-define=LIVE_COMPARE=true
          mkdir -p build/dist && cp build/app/outputs/flutter-apk/app-play-debug.apk build/dist/app-debug.apk
      - name: Android lint NewApi (minSdk 29 API guard)
        working-directory: android
        run: ./gradlew :app:lintPlayDebug --no-daemon
      - name: App JVM unit tests (StartGuard)
        working-directory: android
        run: ./gradlew :app:testPlayDebugUnitTest --no-daemon
      - name: Maps key meta-data is in the merged manifest (name only, value never printed)
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt"
          n=$("$AAPT" dump xmltree build/dist/app-debug.apk AndroidManifest.xml | grep -c 'com.google.android.geo.API_KEY' || true)
          [ "$n" -ge 1 ] || { echo "::error::com.google.android.geo.API_KEY meta-data missing from the manifest"; exit 1; }
          if [ -z "$RUN_SOLO_MAPS_API_KEY" ]; then echo "::warning::RUN_SOLO_MAPS_API_KEY secret is not set; this build has an empty Maps key"; fi
      - name: Build release AAB (debug-signed here; the Play-signed one is the release-aab job)
        if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: flutter build appbundle --release --flavor play --obfuscate --split-debug-info=build/symbols $MAPS_DEFINE
      - name: 16 KB page-size check (debug APK)
        run: |
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          tools/check_16kb_alignment.sh build/dist/app-debug.apk "$ZIPALIGN"
      - name: 16 KB page-size check (release AAB, includes libapp.so)
        if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: tools/check_16kb_alignment.sh build/app/outputs/bundle/playRelease/app-play-release.aab
      # Only the emulator jobs (nightly, tags, dispatch, full-ci) consume it.
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        with:
          name: run-solo-debug-apk
          path: build/dist/app-debug.apk
          if-no-files-found: error
          retention-days: 2

  build-dogfood:
    name: build dogfood APK (arm64, R8, signed)
    # Every push (main, tags), dispatch, full-ci PRs, and the nightly (artifacts suffixed -nightly so
    # they never pass for the main-push APK that builders download).
    needs: changes
    if: ${{ !cancelled() && !(github.event.action == 'labeled' && github.event.label.name != 'full-ci') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event_name == 'schedule' && needs.changes.outputs.nightly == 'true')) }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      # Google Maps key (plan §18.3): manifest placeholder via build.gradle.kts and the same value
      # as --dart-define (String.fromEnvironment) so the app knows whether a map can load. Empty
      # when the secret is absent: the build still passes and the map shows its failed state.
      # Scoped to the jobs that build the app, never printed (do not add `flutter -v` or
      # `--info`: Flutter forwards dart-defines to Gradle base64-encoded, which GitHub cannot mask).
      RUN_SOLO_MAPS_API_KEY: ${{ secrets.RUN_SOLO_MAPS_API_KEY }}
      MAPS_DEFINE: --dart-define=RUN_SOLO_MAPS_API_KEY=${{ secrets.RUN_SOLO_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (the image's disk filled up; df before and after)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Decode dogfood keystore (repo secrets RUN_SOLO_DOGFOOD_*)
        env:
          KS_B64: ${{ secrets.RUN_SOLO_DOGFOOD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "RUN_SOLO_DOGFOOD_KEYSTORE_BASE64 secret missing" >&2; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dogfood.jks"
          echo "RUN_SOLO_DOGFOOD_KEYSTORE=$RUNNER_TEMP/dogfood.jks" >> "$GITHUB_ENV"
      # Dogfood only: stamp a per-build version so every drop is a "new version"
      # and the full lap-draw intro (with the runner photo) replays once per
      # install - the intro gate keys on kAppVersion (founder 28-Sep). Prod
      # gating is unchanged; run_number keeps versionCode monotonic for
      # upgrade installs. pubspec and version.dart are stamped together so
      # app_version_test would still pass.
      - name: Stamp dogfood version (0.1.0+<run number>)
        run: |
          V="0.1.0+${{ github.run_number }}"
          sed -i "s/^version: .*/version: $V/" pubspec.yaml
          sed -i "s/const String kAppVersion = '[^']*';/const String kAppVersion = '$V';/" lib/app/version.dart
          grep -n '^version:' pubspec.yaml
          grep -n 'kAppVersion' lib/app/version.dart
      # Live compare ON in the dogfood (founder 28-Sep): same LV2 gate as the
      # debug build; prod stays dark until the same call is made for it.
      - name: Build dogfood APKs (arm64 for the phone, x86_64 for the emulator smoke)
        env:
          RUN_SOLO_DOGFOOD_STORE_PASSWORD: ${{ secrets.RUN_SOLO_DOGFOOD_STORE_PASSWORD }}
          RUN_SOLO_DOGFOOD_KEY_ALIAS: dogfood  # not a secret: a secret value here masks the word in logs
          RUN_SOLO_DOGFOOD_KEY_PASSWORD: ${{ secrets.RUN_SOLO_DOGFOOD_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor dogfood --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --obfuscate --split-debug-info=build/symbols-dogfood $MAPS_DEFINE \
            --dart-define=LIVE_COMPARE=true
          ls -la build/app/outputs/flutter-apk/
      - name: Verify signer, size (< 36 MiB) and 16 KB alignment
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-dogfood-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"; ls "$BT" | grep -E "^(apksigner|aapt|zipalign)$"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signer.txt" 2>&1 || true
          cat "$RUNNER_TEMP/signer.txt"
          grep -q "CN=Run Solo dogfood" "$RUNNER_TEMP/signer.txt" || { echo "dogfood APK is not signed with the dogfood key" >&2; exit 1; }
          "$BT/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt" 2>&1 || true
          grep -E "^package:" "$RUNNER_TEMP/badging.txt" || true
          grep -q "name='app.runsolo.dogfood'" "$RUNNER_TEMP/badging.txt" || { echo "unexpected applicationId" >&2; exit 1; }
          tools/check_16kb_alignment.sh "$APK" "$BT/zipalign"
          SIZE=$(stat -c %s "$APK"); MIB=$(awk "BEGIN{printf \"%.1f\", $SIZE/1048576}")
          echo "dogfood arm64 APK: ${MIB} MiB ($SIZE bytes)"
          echo "### Dogfood APK: ${MIB} MiB (app.runsolo.dogfood, arm64-v8a, R8)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt $((36 * 1048576)) ]; then echo "dogfood APK exceeds 36 MiB (maplibre_gl added ~12.7 MiB, T0)" >&2; exit 1; fi
      # The phone build: main, tags, dispatch, full-ci. The nightly only smokes the x64 build.
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'schedule' }}
        with:
          name: run-solo-dogfood-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-dogfood-release.apk
          if-no-files-found: error
          retention-days: 5
      # Only emulator-dogfood consumes it (nightly, tags, dispatch, full-ci; not main pushes).
      - uses: actions/upload-artifact@v4
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        with:
          name: run-solo-dogfood-x64-apk${{ github.event_name == 'schedule' && '-nightly' || '' }}
          path: build/app/outputs/flutter-apk/app-x86_64-dogfood-release.apk
          if-no-files-found: error
          retention-days: 2

  release-aab:
    # Play upload (plan §11): manual run or a v* tag. Signed with the upload key from the
    # RUN_SOLO_UPLOAD_* secrets (offline copy ~/.secrets/run-solo/); Play App Signing re-signs
    # with the app-signing key. Not on PRs, so it adds nothing to the PR gate.
    name: release AAB (play, upload-key signed)
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      # Google Maps key (plan §18.3): manifest placeholder via build.gradle.kts and the same value
      # as --dart-define (String.fromEnvironment) so the app knows whether a map can load. Empty
      # when the secret is absent: the build still passes and the map shows its failed state.
      # Scoped to the jobs that build the app, never printed (do not add `flutter -v` or
      # `--info`: Flutter forwards dart-defines to Gradle base64-encoded, which GitHub cannot mask).
      RUN_SOLO_MAPS_API_KEY: ${{ secrets.RUN_SOLO_MAPS_API_KEY }}
      MAPS_DEFINE: --dart-define=RUN_SOLO_MAPS_API_KEY=${{ secrets.RUN_SOLO_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (the image's disk filled up; df before and after)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Verify release tag and pubspec version
        # Manual dispatch is allowed from any ref; only version-shaped tags are release refs.
        # A tag must match the versionName in pubspec before a signed bundle is made.
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          match = re.search(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)\s*$',
                            Path('pubspec.yaml').read_text(), re.MULTILINE)
          if not match:
              raise SystemExit('pubspec.yaml needs version: MAJOR.MINOR.PATCH+positiveBuildNumber')
          version, build = match.groups()
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != f'refs/tags/v{version}':
              raise SystemExit(f'{ref} does not match pubspec version v{version}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_VERSION={version}\nRELEASE_BUILD={build}\n')
          print(f'Release version {version}+{build}; ref {ref}')
          PYCODE
      - name: Decode upload keystore (repo secrets RUN_SOLO_UPLOAD_*)
        env:
          KS_B64: ${{ secrets.RUN_SOLO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::RUN_SOLO_UPLOAD_KEYSTORE_BASE64 secret missing" >&2; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RUN_SOLO_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Preflight the upload key (alias + passwords open; PKCS12 key password = store password)
        env:
          RUN_SOLO_UPLOAD_STORE_PASSWORD: ${{ secrets.RUN_SOLO_UPLOAD_STORE_PASSWORD }}
          RUN_SOLO_UPLOAD_KEY_PASSWORD: ${{ secrets.RUN_SOLO_UPLOAD_KEY_PASSWORD }}
        run: |
          keytool -list -keystore "$RUN_SOLO_UPLOAD_KEYSTORE" -storepass:env RUN_SOLO_UPLOAD_STORE_PASSWORD -alias upload > /dev/null \
            || { echo "::error::upload keystore: store password or alias 'upload' is wrong"; exit 1; }
          # The only way to prove the key password without printing anything: export the key with it.
          keytool -importkeystore -srckeystore "$RUN_SOLO_UPLOAD_KEYSTORE" -srcstorepass:env RUN_SOLO_UPLOAD_STORE_PASSWORD \
            -srcalias upload -srckeypass:env RUN_SOLO_UPLOAD_KEY_PASSWORD \
            -destkeystore "$RUNNER_TEMP/preflight.p12" -deststoretype PKCS12 -deststorepass:env RUN_SOLO_UPLOAD_STORE_PASSWORD -noprompt > /dev/null 2>&1 \
            || { echo "::error::upload keystore: RUN_SOLO_UPLOAD_KEY_PASSWORD does not open alias 'upload'"; exit 1; }
          rm -f "$RUNNER_TEMP/preflight.p12"
          echo "upload key preflight ok"
      - name: Build release AAB (play flavour, R8, obfuscated, split debug info)
        env:
          RUN_SOLO_UPLOAD_STORE_PASSWORD: ${{ secrets.RUN_SOLO_UPLOAD_STORE_PASSWORD }}
          RUN_SOLO_UPLOAD_KEY_ALIAS: upload  # not a secret: a secret value here masks the word in logs
          RUN_SOLO_UPLOAD_KEY_PASSWORD: ${{ secrets.RUN_SOLO_UPLOAD_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --flavor play --obfuscate --split-debug-info=build/symbols-play $MAPS_DEFINE
          ls -la build/app/outputs/bundle/playRelease/
      - name: Verify signer (upload key), 16 KB alignment, Maps meta-data present
        run: |
          AAB=build/app/outputs/bundle/playRelease/app-play-release.aab
          jarsigner -verify -verbose:summary -certs "$AAB" > "$RUNNER_TEMP/signer.txt" 2>&1 || true
          grep -q "CN=Run Solo upload" "$RUNNER_TEMP/signer.txt" || { tail -20 "$RUNNER_TEMP/signer.txt"; echo "AAB is not signed with the upload key" >&2; exit 1; }
          grep -q "jar verified" "$RUNNER_TEMP/signer.txt" || { tail -20 "$RUNNER_TEMP/signer.txt"; echo "AAB signature did not verify" >&2; exit 1; }
          tools/check_16kb_alignment.sh "$AAB"
          # The bundle manifest is protobuf; the attribute name still appears as a plain string.
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | grep -aq 'com.google.android.geo.API_KEY' || { echo "Maps meta-data missing from the bundle manifest" >&2; exit 1; }
          if [ -z "$RUN_SOLO_MAPS_API_KEY" ]; then echo "::warning::RUN_SOLO_MAPS_API_KEY secret is not set; the Play build will show 'Map failed to load'"; fi
          SIZE=$(stat -c %s "$AAB"); MIB=$(awk "BEGIN{printf \"%.1f\", $SIZE/1048576}")
          echo "### Play AAB: ${MIB} MiB (app.runsolo, upload-key signed, ${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect the AAB and R8 mapping (native symbols travel inside the AAB via ndk.debugSymbolLevel FULL)
        run: |
          # Artifact names cannot contain "/", and a branch dispatch has one (release/phase2).
          echo "REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
          mkdir -p build/dist-play
          cp build/app/outputs/bundle/playRelease/app-play-release.aab build/dist-play/
          cp build/app/outputs/mapping/playRelease/mapping.txt build/dist-play/mapping.txt
          unzip -l build/dist-play/app-play-release.aab | grep -q "BUNDLE-METADATA/com.android.tools.build.debugsymbols" || { echo "native debug symbols missing from the AAB" >&2; exit 1; }
          ls -la build/dist-play
      - name: Release manifest and checksums
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path

          dist = Path('build/dist-play')
          files = (dist / 'app-play-release.aab', dist / 'mapping.txt')
          checksums = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksums.append(f'{digest}  {path.name}')
          manifest = {
              'app': 'Run Supreme',
              'package': 'app.runsolo',
              'version_name': os.environ['RELEASE_VERSION'],
              'version_code': int(os.environ['RELEASE_BUILD']),
              'git_ref': os.environ['GITHUB_REF'],
              'git_sha': os.environ['GITHUB_SHA'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'files': {path.name: {'sha256': line.split()[0], 'bytes': path.stat().st_size}
                        for path, line in zip(files, checksums)},
          }
          (dist / 'release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (dist / 'SHA256SUMS').write_text('\n'.join(checksums) + '\n')
          print(f"Release: {manifest['version_name']}+{manifest['version_code']} ({manifest['git_sha'][:12]})")
          PYCODE
          echo "Release manifest and SHA256SUMS are packaged alongside the AAB." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: run-solo-play-aab-${{ env.REF }}
          path: |
            build/dist-play/app-play-release.aab
            build/dist-play/release-manifest.json
            build/dist-play/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: run-solo-play-symbols-${{ env.REF }}
          path: |
            build/dist-play/mapping.txt
            build/symbols-play
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: emulator smoke (API ${{ matrix.api-level }})
    needs: [build-apk, changes]
    if: ${{ !cancelled() && needs.build-apk.result == 'success' && ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && (github.event_name != 'schedule' || needs.changes.outputs.nightly == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(needs.changes.outputs.smoke_apis || '[29, 34, 36]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run-solo-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Boot, install, launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            tools/emulator_smoke.sh apk/app-debug.apk app.runsolo.debug
            tools/emulator_lifecycle.sh apk/app-debug.apk app.runsolo.debug intervals
            tools/emulator_lifecycle.sh apk/app-debug.apk app.runsolo.debug laps
            tools/emulator_lifecycle.sh apk/app-debug.apk app.runsolo.debug free
            tools/emulator_splash_shots.sh app.runsolo.debug
      - name: Upload splash hand-off shots (B3 evidence)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: splash-shots-api${{ matrix.api-level }}
          path: splash-shots
          if-no-files-found: ignore
          retention-days: 2

  emulator-replay:
    # I5: one replay per session kind through the real service; the run file must match the
    # core-jvm fixture recorded from the same trace (tools/check_replay_run.py).
    name: emulator replay ${{ matrix.kind }} (API 34)
    needs: [build-apk, changes]
    if: ${{ !cancelled() && needs.build-apk.result == 'success' && ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && (github.event_name != 'schedule' || needs.changes.outputs.nightly == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # t4: the Phase 4 T4 replays with a LiveContext, one after another, each also checked against its transcript.
        kind: ${{ fromJSON(needs.changes.outputs.replay_kinds || '["4x4", "400s", "30-30s", "yasso-800s", "1km-repeats", "fartlek", "cooper", "parkrun", "goal-10k", "goal-30min", "pause-end", "auto-pause", "t4"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run-solo-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Boot, replay ${{ matrix.kind }}, compare with the fixture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: tools/emulator_replay_kind.sh apk/app-debug.apk app.runsolo.debug ${{ matrix.kind }}

  emulator-dogfood:
    name: emulator smoke, dogfood R8 build (API 36)
    # Nightly, tags, dispatch and full-ci only: the per-merge main push builds the dogfood APK but
    # does not smoke it (zero hosted emulator minutes per merge).
    needs: build-dogfood
    if: ${{ !cancelled() && needs.build-dogfood.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run-solo-dogfood-x64-apk${{ github.event_name == 'schedule' && '-nightly' || '' }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # The full lifecycle test needs `run-as` (debuggable packages only); the dogfood build is
      # release, so it gets the launch smoke plus a logcat-only replay check.
      - name: Boot, install, launch, replay smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            tools/emulator_smoke.sh apk/app-x86_64-dogfood-release.apk app.runsolo.dogfood
            tools/emulator_replay_smoke.sh apk/app-x86_64-dogfood-release.apk app.runsolo.dogfood

  artifact-cleanup:
    # Artifact storage is capped (500 MB on the private free plan). The nightly's APKs are only
    # for its own emulator jobs, so delete them when the run ends, and keep just the newest 5
    # dogfood phone APKs (~35 MB each) of the ones main pushes produce.
    name: trim artifacts
    needs: [build-apk, build-dogfood, emulator, emulator-replay, emulator-dogfood]
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (needs.build-apk.result != 'skipped' || needs.build-dogfood.result != 'skipped') }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete consumed nightly APKs, keep the newest 5 dogfood phone APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request

          repo, token, run = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'], os.environ['GITHUB_RUN_ID']

          def api(method, path):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}', method=method,
                                           headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req) as resp:
                  body = resp.read()
              return json.loads(body) if body else None

          def delete(artifact):
              api('DELETE', f"actions/artifacts/{artifact['id']}")
              print(f"deleted {artifact['name']} ({artifact['size_in_bytes'] // 1048576} MB)")

          if os.environ['EVENT'] == 'schedule':
              for a in api('GET', f'actions/runs/{run}/artifacts?per_page=100')['artifacts']:
                  if a['name'].startswith(('run-solo-debug-apk', 'run-solo-dogfood-x64-apk')):
                      delete(a)
          phone = [a for a in api('GET', 'actions/artifacts?name=run-solo-dogfood-apk&per_page=100')['artifacts'] if not a['expired']]
          phone.sort(key=lambda a: a['created_at'], reverse=True)
          for a in phone[5:]:
              delete(a)
          PYCODE
