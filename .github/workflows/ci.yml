name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the same stable the dev host runs (~/tools/flutter). Bump both together.
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'

jobs:
  changes:
    # CI diet: the emulator jobs (8 replays + 3 smokes + dogfood smoke) saturate the runners.
    # They run in full on main, tags and manual runs, and on PRs that touch the native side;
    # other PRs get the API 34 smoke only. Skipped jobs report "skipped", which GitHub counts
    # as passing for required checks, and cost no runner. If this job fails, the gated jobs run
    # the full set instead of skipping (their `if` checks needs.changes.result).
    name: which paths changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"; echo "not a PR: full emulator set"; exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "$changed"
          # android/ includes android/core-jvm. The workflow itself and pubspec (plugins ship
          # native code) count too, so a CI or plugin change is always tested in full.
          if echo "$changed" | grep -qE '^(android/|pigeons/|packages/run_engine/test/fixtures/contract|tools/emulator_|tools/check_replay_run\.py|\.github/workflows/|pubspec\.(yaml|lock)$)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"; echo "native paths changed: full emulator set"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"; echo "no native paths: API 34 smoke only"
          fi

  flutter:
    name: analyze + test (app, run_engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: run_engine deps (flutter analyze from the root also analyzes the package)
        working-directory: packages/run_engine
        run: dart pub get
      - name: Pigeon output is committed and current
        run: |
          dart run pigeon --input pigeons/platform_api.dart
          git diff --exit-code -- lib/platform android/app/src/main/kotlin/app/runsolo/platform
      - name: Format
        # Generated Pigeon output is excluded: it is checked for drift above, not formatted.
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/main.dart lib/screens lib/theme lib/platform/platform.dart test pigeons packages/run_engine
      - name: Event names come from the flavour config (K1 trademark rule)
        run: python3 tools/check_event_names.py
      - name: Analyze
        run: flutter analyze
      - name: App tests
        run: flutter test
      - name: run_engine tests
        working-directory: packages/run_engine
        run: dart test
      - name: Render goldens (artifact; commit into test/golden/goldens to enable the golden tests)
        # The aarch64 dev host cannot render them; this Linux runner is the
        # reference. Never fails the job, and still runs when a golden test
        # failed (that is when the fresh PNG is needed).
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p test/golden/goldens
          flutter test --update-goldens test/golden
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: goldens
          path: test/golden/goldens
          if-no-files-found: ignore
          retention-days: 7
      - name: Kotlin→Dart contract fixtures are identical copies
        # core-jvm writes the top-level (schema 3) files from the real recording
        # path; schema1/ and schema2/ are frozen older output (plan §18.7,
        # Phase 3 §3.8). run_engine
        # tests both. A drift on either side, or an empty directory, fails here
        # (review P1-4).
        run: |
          kotlin=android/core-jvm/src/test/fixtures/contract
          dart=packages/run_engine/test/fixtures/contract
          for dir in "$kotlin" "$kotlin/schema1" "$kotlin/schema2"; do
            count=$(ls "$dir"/*.json 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::no Kotlin contract fixtures in $dir"; exit 1
            fi
            echo "contract fixtures: $count files in $dir"
          done
          diff -r "$kotlin" "$dart"
          echo "contract fixtures identical to run_engine copies (both ways)"
      - name: Kotlin→Dart event-trace fixtures are identical copies
        # EventChannel traces (RecorderEvent + status snapshots) for the Dart controller test;
        # a separate dir so the run-file contract test never sees them.
        run: |
          kotlin=android/core-jvm/src/test/fixtures/contract-events
          dart=packages/run_engine/test/fixtures/contract-events
          count=$(ls "$kotlin"/*.ndjson 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no Kotlin event-trace fixtures in $kotlin"; exit 1
          fi
          diff -r "$kotlin" "$dart"
          echo "event-trace fixtures: $count Kotlin files identical to run_engine copies (both ways)"

  brand:
    name: brand vectors are current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r assets/brand/requirements.txt
      - name: Regenerate and diff (vectors only; PNG antialiasing may differ by platform)
        run: |
          python assets/brand/build_brand.py
          # status, not diff: a new file the generator writes is untracked and
          # git diff would miss it.
          drift=$(git status --porcelain -- assets/brand/svg android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 lib/brand)
          if [ -n "$drift" ]; then echo "Brand vectors drifted; run build_brand.py and commit:"; echo "$drift"; git diff --stat; exit 1; fi

  core-jvm:
    name: core-jvm tests (pure Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: android/core-jvm
        run: ./gradlew test --no-daemon
      - name: Regenerate fixtures; any drift is uploaded (fixtures are never hand-edited)
        if: ${{ !cancelled() }}
        working-directory: android/core-jvm
        run: |
          ./gradlew regenerateFixtures --no-daemon
          cd ../..
          drift=$(git status --porcelain --untracked-files=all -- android/core-jvm/src/test/fixtures packages/run_engine/test/fixtures)
          if [ -n "$drift" ]; then
            echo "::error::generated fixtures differ from the checked-in files; download the regenerated-fixtures artifact and commit it:"
            echo "$drift"
            mkdir -p /tmp/regen
            git status --porcelain -z --untracked-files=all -- android/core-jvm/src/test/fixtures packages/run_engine/test/fixtures | tr '\0' '\n' | cut -c4- | xargs -r -I{} cp --parents {} /tmp/regen/
            echo "drift=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.drift == '1' }}
        with:
          name: regenerated-fixtures
          path: /tmp/regen
      - name: Fail on fixture drift
        if: ${{ !cancelled() && env.drift == '1' }}
        run: exit 1

  build-apk:
    name: build debug APK + 16 KB check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Google Maps key (plan §18.3): manifest placeholder via build.gradle.kts and the same value
      # as --dart-define (String.fromEnvironment) so the app knows whether a map can load. Empty
      # when the secret is absent: the build still passes and the map shows its failed state.
      # Scoped to the jobs that build the app, never printed (do not add `flutter -v` or
      # `--info`: Flutter forwards dart-defines to Gradle base64-encoded, which GitHub cannot mask).
      RUN_SOLO_MAPS_API_KEY: ${{ secrets.RUN_SOLO_MAPS_API_KEY }}
      MAPS_DEFINE: --dart-define=RUN_SOLO_MAPS_API_KEY=${{ secrets.RUN_SOLO_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build debug APK (play flavour, app.runsolo.debug)
        run: |
          flutter build apk --debug --flavor play $MAPS_DEFINE
          mkdir -p build/dist && cp build/app/outputs/flutter-apk/app-play-debug.apk build/dist/app-debug.apk
      - name: Android lint NewApi (minSdk 29 API guard)
        working-directory: android
        run: ./gradlew :app:lintPlayDebug --no-daemon
      - name: App JVM unit tests (StartGuard)
        working-directory: android
        run: ./gradlew :app:testPlayDebugUnitTest --no-daemon
      - name: Maps key meta-data is in the merged manifest (name only, value never printed)
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt"
          n=$("$AAPT" dump xmltree build/dist/app-debug.apk AndroidManifest.xml | grep -c 'com.google.android.geo.API_KEY' || true)
          [ "$n" -ge 1 ] || { echo "::error::com.google.android.geo.API_KEY meta-data missing from the manifest"; exit 1; }
          if [ -z "$RUN_SOLO_MAPS_API_KEY" ]; then echo "::warning::RUN_SOLO_MAPS_API_KEY secret is not set; this build has an empty Maps key"; fi
      - name: Build release AAB (debug-signed here; the Play-signed one is the release-aab job)
        run: flutter build appbundle --release --flavor play --obfuscate --split-debug-info=build/symbols $MAPS_DEFINE
      - name: 16 KB page-size check (debug APK)
        run: |
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          tools/check_16kb_alignment.sh build/dist/app-debug.apk "$ZIPALIGN"
      - name: 16 KB page-size check (release AAB, includes libapp.so)
        run: tools/check_16kb_alignment.sh build/app/outputs/bundle/playRelease/app-play-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: run-solo-debug-apk
          path: build/dist/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-dogfood:
    name: build dogfood APK (arm64, R8, signed)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Google Maps key (plan §18.3): manifest placeholder via build.gradle.kts and the same value
      # as --dart-define (String.fromEnvironment) so the app knows whether a map can load. Empty
      # when the secret is absent: the build still passes and the map shows its failed state.
      # Scoped to the jobs that build the app, never printed (do not add `flutter -v` or
      # `--info`: Flutter forwards dart-defines to Gradle base64-encoded, which GitHub cannot mask).
      RUN_SOLO_MAPS_API_KEY: ${{ secrets.RUN_SOLO_MAPS_API_KEY }}
      MAPS_DEFINE: --dart-define=RUN_SOLO_MAPS_API_KEY=${{ secrets.RUN_SOLO_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Decode dogfood keystore (repo secrets RUN_SOLO_DOGFOOD_*)
        env:
          KS_B64: ${{ secrets.RUN_SOLO_DOGFOOD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "RUN_SOLO_DOGFOOD_KEYSTORE_BASE64 secret missing" >&2; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dogfood.jks"
          echo "RUN_SOLO_DOGFOOD_KEYSTORE=$RUNNER_TEMP/dogfood.jks" >> "$GITHUB_ENV"
      - name: Build dogfood APKs (arm64 for the phone, x86_64 for the emulator smoke)
        env:
          RUN_SOLO_DOGFOOD_STORE_PASSWORD: ${{ secrets.RUN_SOLO_DOGFOOD_STORE_PASSWORD }}
          RUN_SOLO_DOGFOOD_KEY_ALIAS: dogfood  # not a secret: a secret value here masks the word in logs
          RUN_SOLO_DOGFOOD_KEY_PASSWORD: ${{ secrets.RUN_SOLO_DOGFOOD_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor dogfood --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --obfuscate --split-debug-info=build/symbols-dogfood $MAPS_DEFINE
          ls -la build/app/outputs/flutter-apk/
      - name: Verify signer, size (< 30 MiB) and 16 KB alignment
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-dogfood-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"; ls "$BT" | grep -E "^(apksigner|aapt|zipalign)$"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signer.txt" 2>&1 || true
          cat "$RUNNER_TEMP/signer.txt"
          grep -q "CN=Run Solo dogfood" "$RUNNER_TEMP/signer.txt" || { echo "dogfood APK is not signed with the dogfood key" >&2; exit 1; }
          "$BT/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt" 2>&1 || true
          grep -E "^package:" "$RUNNER_TEMP/badging.txt" || true
          grep -q "name='app.runsolo.dogfood'" "$RUNNER_TEMP/badging.txt" || { echo "unexpected applicationId" >&2; exit 1; }
          tools/check_16kb_alignment.sh "$APK" "$BT/zipalign"
          SIZE=$(stat -c %s "$APK"); MIB=$(awk "BEGIN{printf \"%.1f\", $SIZE/1048576}")
          echo "dogfood arm64 APK: ${MIB} MiB ($SIZE bytes)"
          echo "### Dogfood APK: ${MIB} MiB (app.runsolo.dogfood, arm64-v8a, R8)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt $((30 * 1048576)) ]; then echo "dogfood APK exceeds 30 MiB" >&2; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: run-solo-dogfood-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-dogfood-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: run-solo-dogfood-x64-apk
          path: build/app/outputs/flutter-apk/app-x86_64-dogfood-release.apk
          if-no-files-found: error
          retention-days: 7

  release-aab:
    # Play upload (plan §11): manual run or a v* tag. Signed with the upload key from the
    # RUN_SOLO_UPLOAD_* secrets (offline copy ~/.secrets/run-solo/); Play App Signing re-signs
    # with the app-signing key. Not on PRs, so it adds nothing to the PR gate.
    name: release AAB (play, upload-key signed)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Google Maps key (plan §18.3): manifest placeholder via build.gradle.kts and the same value
      # as --dart-define (String.fromEnvironment) so the app knows whether a map can load. Empty
      # when the secret is absent: the build still passes and the map shows its failed state.
      # Scoped to the jobs that build the app, never printed (do not add `flutter -v` or
      # `--info`: Flutter forwards dart-defines to Gradle base64-encoded, which GitHub cannot mask).
      RUN_SOLO_MAPS_API_KEY: ${{ secrets.RUN_SOLO_MAPS_API_KEY }}
      MAPS_DEFINE: --dart-define=RUN_SOLO_MAPS_API_KEY=${{ secrets.RUN_SOLO_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Decode upload keystore (repo secrets RUN_SOLO_UPLOAD_*)
        env:
          KS_B64: ${{ secrets.RUN_SOLO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::RUN_SOLO_UPLOAD_KEYSTORE_BASE64 secret missing" >&2; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RUN_SOLO_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Preflight the upload key (alias + passwords open; PKCS12 key password = store password)
        env:
          RUN_SOLO_UPLOAD_STORE_PASSWORD: ${{ secrets.RUN_SOLO_UPLOAD_STORE_PASSWORD }}
          RUN_SOLO_UPLOAD_KEY_PASSWORD: ${{ secrets.RUN_SOLO_UPLOAD_KEY_PASSWORD }}
        run: |
          keytool -list -keystore "$RUN_SOLO_UPLOAD_KEYSTORE" -storepass:env RUN_SOLO_UPLOAD_STORE_PASSWORD -alias upload > /dev/null \
            || { echo "::error::upload keystore: store password or alias 'upload' is wrong"; exit 1; }
          # The only way to prove the key password without printing anything: export the key with it.
          keytool -importkeystore -srckeystore "$RUN_SOLO_UPLOAD_KEYSTORE" -srcstorepass:env RUN_SOLO_UPLOAD_STORE_PASSWORD \
            -srcalias upload -srckeypass:env RUN_SOLO_UPLOAD_KEY_PASSWORD \
            -destkeystore "$RUNNER_TEMP/preflight.p12" -deststoretype PKCS12 -deststorepass:env RUN_SOLO_UPLOAD_STORE_PASSWORD -noprompt > /dev/null 2>&1 \
            || { echo "::error::upload keystore: RUN_SOLO_UPLOAD_KEY_PASSWORD does not open alias 'upload'"; exit 1; }
          rm -f "$RUNNER_TEMP/preflight.p12"
          echo "upload key preflight ok"
      - name: Build release AAB (play flavour, R8, obfuscated, split debug info)
        env:
          RUN_SOLO_UPLOAD_STORE_PASSWORD: ${{ secrets.RUN_SOLO_UPLOAD_STORE_PASSWORD }}
          RUN_SOLO_UPLOAD_KEY_ALIAS: upload  # not a secret: a secret value here masks the word in logs
          RUN_SOLO_UPLOAD_KEY_PASSWORD: ${{ secrets.RUN_SOLO_UPLOAD_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --flavor play --obfuscate --split-debug-info=build/symbols-play $MAPS_DEFINE
          ls -la build/app/outputs/bundle/playRelease/
      - name: Verify signer (upload key), 16 KB alignment, Maps meta-data present
        run: |
          AAB=build/app/outputs/bundle/playRelease/app-play-release.aab
          jarsigner -verify -verbose:summary -certs "$AAB" > "$RUNNER_TEMP/signer.txt" 2>&1 || true
          grep -q "CN=Run Solo upload" "$RUNNER_TEMP/signer.txt" || { tail -20 "$RUNNER_TEMP/signer.txt"; echo "AAB is not signed with the upload key" >&2; exit 1; }
          grep -q "jar verified" "$RUNNER_TEMP/signer.txt" || { tail -20 "$RUNNER_TEMP/signer.txt"; echo "AAB signature did not verify" >&2; exit 1; }
          tools/check_16kb_alignment.sh "$AAB"
          # The bundle manifest is protobuf; the attribute name still appears as a plain string.
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | grep -aq 'com.google.android.geo.API_KEY' || { echo "Maps meta-data missing from the bundle manifest" >&2; exit 1; }
          if [ -z "$RUN_SOLO_MAPS_API_KEY" ]; then echo "::warning::RUN_SOLO_MAPS_API_KEY secret is not set; the Play build will show 'Map failed to load'"; fi
          SIZE=$(stat -c %s "$AAB"); MIB=$(awk "BEGIN{printf \"%.1f\", $SIZE/1048576}")
          echo "### Play AAB: ${MIB} MiB (app.runsolo, upload-key signed, ${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect the AAB and R8 mapping (native symbols travel inside the AAB via ndk.debugSymbolLevel FULL)
        run: |
          # Artifact names cannot contain "/", and a branch dispatch has one (release/phase2).
          echo "REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
          mkdir -p build/dist-play
          cp build/app/outputs/bundle/playRelease/app-play-release.aab build/dist-play/
          cp build/app/outputs/mapping/playRelease/mapping.txt build/dist-play/mapping.txt
          unzip -l build/dist-play/app-play-release.aab | grep -q "BUNDLE-METADATA/com.android.tools.build.debugsymbols" || { echo "native debug symbols missing from the AAB" >&2; exit 1; }
          ls -la build/dist-play
      - uses: actions/upload-artifact@v4
        with:
          name: run-solo-play-aab-${{ env.REF }}
          path: build/dist-play/app-play-release.aab
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: run-solo-play-symbols-${{ env.REF }}
          path: |
            build/dist-play/mapping.txt
            build/symbols-play
          if-no-files-found: error
          retention-days: 90

  emulator:
    name: emulator smoke (API ${{ matrix.api-level }})
    needs: [build-apk, changes]
    # Fail-safe: if `changes` itself failed, run the full set instead of skipping (a skipped job
    # reads as passing). always() so a failed `changes` does not skip this job by default.
    if: ${{ !cancelled() && needs.build-apk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # API 34 on every PR; 29 and 36 on main and when native paths change (changes job).
        api-level: ${{ fromJSON((needs.changes.result != 'success' || needs.changes.outputs.native == 'true') && '[29, 34, 36]' || '[34]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run-solo-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Boot, install, launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            tools/emulator_smoke.sh apk/app-debug.apk app.runsolo.debug
            tools/emulator_lifecycle.sh apk/app-debug.apk app.runsolo.debug intervals
            tools/emulator_lifecycle.sh apk/app-debug.apk app.runsolo.debug laps
            tools/emulator_lifecycle.sh apk/app-debug.apk app.runsolo.debug free
            tools/emulator_splash_shots.sh app.runsolo.debug
      - name: Upload splash hand-off shots (B3 evidence)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: splash-shots-api${{ matrix.api-level }}
          path: splash-shots
          if-no-files-found: ignore
          retention-days: 7

  emulator-replay:
    # I5: one replay per session kind through the real service; the run file must match the
    # core-jvm fixture recorded from the same trace (tools/check_replay_run.py).
    name: emulator replay ${{ matrix.kind }} (API 34)
    needs: [build-apk, changes]
    # Runs on native changes, and fail-safe when `changes` failed (never skip-as-green).
    if: ${{ !cancelled() && needs.build-apk.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [4x4, 400s, 30-30s, yasso-800s, 1km-repeats, fartlek, cooper, parkrun, goal-10k, goal-30min, pause-end]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run-solo-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Boot, replay ${{ matrix.kind }}, compare with the fixture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: tools/emulator_replay_kind.sh apk/app-debug.apk app.runsolo.debug ${{ matrix.kind }}

  emulator-dogfood:
    name: emulator smoke, dogfood R8 build (API 36)
    needs: [build-dogfood, changes]
    # Runs on native changes, and fail-safe when `changes` failed (never skip-as-green).
    if: ${{ !cancelled() && needs.build-dogfood.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run-solo-dogfood-x64-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # The full lifecycle test needs `run-as` (debuggable packages only); the dogfood build is
      # release, so it gets the launch smoke plus a logcat-only replay check.
      - name: Boot, install, launch, replay smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            tools/emulator_smoke.sh apk/app-x86_64-dogfood-release.apk app.runsolo.dogfood
            tools/emulator_replay_smoke.sh apk/app-x86_64-dogfood-release.apk app.runsolo.dogfood
