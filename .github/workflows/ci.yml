name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the same stable the dev host runs (~/tools/flutter). Bump both together.
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'

jobs:
  flutter:
    name: analyze + test (app, run_engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: run_engine deps (flutter analyze from the root also analyzes the package)
        working-directory: packages/run_engine
        run: dart pub get
      - name: Pigeon output is committed and current
        run: |
          dart run pigeon --input pigeons/platform_api.dart
          git diff --exit-code -- lib/platform android/app/src/main/kotlin/app/runsolo/platform
      - name: Format
        # Generated Pigeon output is excluded: it is checked for drift above, not formatted.
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/main.dart lib/screens lib/theme lib/platform/platform.dart test pigeons packages/run_engine
      - name: Analyze
        run: flutter analyze
      - name: App tests
        run: flutter test
      - name: run_engine tests
        working-directory: packages/run_engine
        run: dart test
      - name: Kotlin→Dart contract fixtures are identical copies
        # core-jvm writes them from the real recording path; run_engine
        # tests them. A drift on either side fails here (review P1-4).
        run: |
          kotlin=android/core-jvm/src/test/fixtures/contract
          dart=packages/run_engine/test/fixtures/contract
          count=$(ls "$kotlin"/*.json 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no Kotlin contract fixtures in $kotlin"; exit 1
          fi
          diff -r "$kotlin" "$dart"
          echo "contract fixtures: $count Kotlin files identical to run_engine copies (both ways)"

  core-jvm:
    name: core-jvm tests (pure Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: android/core-jvm
        run: ./gradlew test --no-daemon

  build-apk:
    name: build debug APK + 16 KB check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release AAB (debug-signed until Play upload key lands; see README)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
      - name: 16 KB page-size check (debug APK)
        run: |
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          tools/check_16kb_alignment.sh build/app/outputs/flutter-apk/app-debug.apk "$ZIPALIGN"
      - name: 16 KB page-size check (release AAB, includes libapp.so)
        run: tools/check_16kb_alignment.sh build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: run-solo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator:
    name: emulator smoke (API ${{ matrix.api-level }})
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run-solo-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Boot, install, launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            tools/emulator_smoke.sh apk/app-debug.apk app.runsolo.debug
            tools/emulator_lifecycle.sh apk/app-debug.apk app.runsolo.debug
