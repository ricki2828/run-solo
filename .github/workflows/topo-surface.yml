name: topo-surface
# Emulator check for the offline Topo map surface (draft PR): fetches the Milos pack from the live
# R2 hosting, goes offline, and drives run detail, the live map, a Home card and a no-pack run.
# Not part of the main CI: it needs the network once and is slow.
on:
  push:
    branches: [offline-topo-surface]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '21'

jobs:
  topo-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build harness APK (debug, x86_64, play flavour)
        run: |
          flutter build apk --debug --flavor play --target-platform android-x64 \
            -t lib/topo_surface_main.dart
          mkdir -p build/dist && cp build/app/outputs/flutter-apk/app-play-debug.apk build/dist/topo-surface.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Topo surface on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: tools/emulator_topo_surface.sh build/dist/topo-surface.apk app.runsolo.debug
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: topo-surface
          path: topo-surface
          retention-days: 14
