name: topo-surface
# Emulator check for the offline Topo map surface (draft PR): fetches the Milos pack from the live
# R2 hosting, goes offline, and drives run detail, the live map, a Home card and a no-pack run.
# Slow and needs the network once, so it is not part of the nightly: v* tags, manual dispatch and
# PRs labelled `full-ci` only.
on:
  push:
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['docs/**', '**.md', 'companion-server/**']
  workflow_dispatch:

concurrency:
  group: topo-surface-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && 'label' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '21'

jobs:
  topo-surface:
    permissions:
      contents: write
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && !(github.event.action == 'labeled' && github.event.label.name != 'full-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (the image's disk filled up; df before and after)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build harness APK (debug, x86_64, play flavour)
        run: |
          flutter build apk --debug --flavor play --target-platform android-x64 \
            -t lib/topo_surface_main.dart
          mkdir -p build/dist && cp build/app/outputs/flutter-apk/app-play-debug.apk build/dist/topo-surface.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Topo surface on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: tools/emulator_topo_surface.sh build/dist/topo-surface.apk app.runsolo.debug
      - name: Publish the shots to a release (Actions artifact storage is exhausted)
        if: ${{ !cancelled() && vars.USE_ARTIFACTS != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(ls -A topo-surface 2>/dev/null)" ]; then echo "no shots"; exit 0; fi
          python3 -c "import shutil; shutil.make_archive('topo-surface', 'zip', 'topo-surface')"
          tools/ci_release.sh put "ci-topo-${{ github.run_id }}" "topo-surface ${{ github.run_id }}" "Topo surface emulator shots, run ${{ github.run_id }}, sha ${{ github.sha }}. Deleted after 7 days by the ci workflow trim job." topo-surface.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && vars.USE_ARTIFACTS == '1' }}
        with:
          name: topo-surface
          path: topo-surface
          retention-days: 7
