name: ios

# iOS builds on GitHub's macOS runners (iOS plan §6.1, §11; macOS minutes cost 10x). Runs on
# manual dispatch, v* tags, pushes to main that touch android/core-jvm, ios or pigeons, and PRs
# that touch those paths AND carry the `full-ci` label. Never on ordinary Flutter-only PRs.
# Verify a branch with:  gh workflow run ios.yml --ref <branch>
#
# Pins, bump together: Flutter 3.47.5 (same as ci.yml and the dev host), Xcode as selected
# below (the job summary records the exact Xcode and CocoaPods versions of each run).
# Plugins come through CocoaPods only (pubspec: enable-swift-package-manager false).
#
# Release build path for T4 (decided in I0): `flutter build ios --release --config-only`, then
# `xcodebuild archive` and `xcodebuild -exportArchive -allowProvisioningUpdates` with the
# App Store Connect API key flags and ExportOptions destination=upload. `flutter build ipa`
# cannot pass the API key flags, and without them automatic signing on a runner with no
# Xcode account fails. One build, no `--no-codesign` pass before it.

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also archive, sign and upload to TestFlight (UNTESTED; docs/RELEASE.md)'
        type: boolean
        default: false
  push:
    tags: ['v*']
    branches: [main]
    paths: ['android/core-jvm/**', 'ios/**', 'pigeons/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['android/core-jvm/**', 'ios/**', 'pigeons/**']

concurrency:
  # Label noise gets its own group so an unrelated label cannot cancel a real run.
  group: ios-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && 'label' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '21' # same as ci.yml (core-jvm toolchain)
  XCODE_VERSION: 'latest-stable'

jobs:
  verify:
    name: simulator build (no signing)
    permissions:
      contents: write
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && !(github.event.action == 'labeled' && github.event.label.name != 'full-ci')) }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # restore + save, not actions/cache: its post step skips the save when the job fails.
      - name: Kotlin/Native toolchain cache
        id: konan
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-2.4.0 # bump with Kotlin in core-jvm/build.gradle.kts
      - name: Versions
        run: |
          mkdir -p build/ios-logs
          {
            echo "### iOS toolchain"
            echo '```'
            xcodebuild -version
            flutter --version | head -1
            echo "CocoaPods $(pod --version)"
            sw_vers -productVersion | sed 's/^/macOS /'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: flutter pub get
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build/ios-logs/1-pub-get.log
      - name: Shared core XCFramework (Kotlin Multiplatform, iOS plan K3)
        # ios-arm64 + ios-arm64-simulator, static. Copied to ios/RunCore/ (gitignored) and linked
        # into Runner by add_targets.rb.
        working-directory: android/core-jvm
        run: |
          set -o pipefail
          ./gradlew assembleRunCoreReleaseXCFramework --no-daemon 2>&1 | tee ../../build/ios-logs/1b-xcframework.log
          rm -rf ../../ios/RunCore && mkdir -p ../../ios/RunCore
          cp -R build/XCFrameworks/release/RunCore.xcframework ../../ios/RunCore/
          {
            echo "### RunCore.xcframework"
            echo '```'
            for slice in ../../ios/RunCore/RunCore.xcframework/*/; do
              echo "$(basename "$slice"): $(du -sk "$slice" | cut -f1) KB"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save Kotlin/Native toolchain
        if: ${{ !cancelled() && steps.konan.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-2.4.0
      - name: Xcode project targets (add_targets.rb)
        run: |
          set -o pipefail
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj --user-install
          ruby ios/tools/add_targets.rb 2>&1 | tee build/ios-logs/2-add-targets.log
          grep -n "RunCore" ios/Runner.xcodeproj/project.pbxproj | tee -a build/ios-logs/2-add-targets.log
      - name: pod install
        working-directory: ios
        run: |
          set -o pipefail
          pod install --repo-update 2>&1 | tee ../build/ios-logs/3-pod-install.log
      - name: flutter build ios --simulator
        run: |
          set -o pipefail
          flutter build ios --simulator --debug -v 2>&1 | tee build/ios-logs/4-build.log
      - name: XCTest (RunnerTests - Kotlin core via the facade, P2 location, P3 recorder host)
        # Hosted in Runner on the newest iPhone simulator. The tests compare each replay run file
        # with the Kotlin contract fixtures (parsed JSON equality).
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in sorted(d.items()) if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" -only-testing:RunnerTests \
            -resultBundlePath build/ios-logs/RunnerTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ios-logs/4b-xctest.log | grep -iE "error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)|\*\* " || true
          xcrun simctl shutdown all || true # the smoke step boots its own
          grep -q "TEST SUCCEEDED" build/ios-logs/4b-xctest.log
          # Xcode 26 prints "Test case '...' passed"; fail if the core tests were not compiled in.
          grep -qE "Test case 'CoreFacadeTests\.testEveryReplayKindMatchesItsKotlinFixture\(\)' passed" build/ios-logs/4b-xctest.log
          # P3: the Swift recorder wiring reproduces every contract fixture and survives a kill.
          grep -qE "Test case 'RecorderHostTests\.testEveryReplayKindThroughTheSwiftWiringMatchesItsKotlinFixture\(\)' passed" build/ios-logs/4b-xctest.log
          grep -qE "Test case 'RecorderHostTests\.testKillMidRunThenRecoverOnNextOpen\(\)' passed" build/ios-logs/4b-xctest.log
      - name: dSYMs
        # Debug builds keep DWARF in the object files; dsymutil links them while DerivedData
        # still exists. Release dSYMs come from the T4 archive.
        run: |
          set -o pipefail
          mkdir -p build/ios-dsyms
          app=build/ios/iphonesimulator/Runner.app
          dsymutil "$app/Runner" -o build/ios-dsyms/Runner.app.dSYM 2>&1 | tee build/ios-logs/5-dsym.log
          for fw in "$app"/Frameworks/*.framework; do
            name=$(basename "$fw" .framework)
            [ -f "$fw/$name" ] && dsymutil "$fw/$name" -o "build/ios-dsyms/$name.framework.dSYM" 2>&1 | tee -a build/ios-logs/5-dsym.log
          done
          ls build/ios-dsyms
      - name: Simulator smoke (launch, screenshot Home)
        run: |
          set -o pipefail
          {
            udid=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
            echo "simulator $udid"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" build/ios/iphonesimulator/Runner.app
            # First launch creates the data container and lands on onboarding; skip it by seeding
            # settings so the screenshot is Home.
            xcrun simctl launch "$udid" app.runsupreme
            sleep 8
            xcrun simctl terminate "$udid" app.runsupreme
            seed="$(xcrun simctl get_app_container "$udid" app.runsupreme data)/Library/Application Support/state"
            mkdir -p "$seed"
            echo '{"onboardingDone":true}' > "$seed/settings.json"
            xcrun simctl launch --console-pty "$udid" app.runsupreme > build/ios-logs/launch.log 2>&1 &
            mkdir -p build/ios-smoke
            for t in 8 16 24; do
              sleep 8
              xcrun simctl io "$udid" screenshot build/ios-smoke/home-$t.png
            done
            cp build/ios-smoke/home-24.png build/ios-smoke/home.png
            echo "--- app log"
            xcrun simctl spawn "$udid" log show --last 3m --style compact --predicate 'process == "Runner"' | tail -60
            data=$(xcrun simctl get_app_container "$udid" app.runsupreme data)
            support="$data/Library/Application Support"
            echo "--- Application Support ($support)"
            ls -la "$support"
            for f in "$support"/state/*; do echo "--- $f"; head -c 500 "$f"; echo; done
            # journals/ is made by Swift, state/ or runs/ by Dart: both under one root = path_provider dir equals Swift dir.
            [ -d "$support/journals" ] || { echo "SMOKE FAIL: Swift journals/ missing"; exit 1; }
            [ -d "$support/state" ] || [ -d "$support/runs" ] || { echo "SMOKE FAIL: Dart state/ not in the Swift directory"; exit 1; }
            xcrun simctl spawn "$udid" launchctl list | grep -i runsupreme || { echo "SMOKE FAIL: app not running after 25 s"; exit 1; }
            echo "SMOKE OK"
          } 2>&1 | tee build/ios-logs/6-smoke.log
      - uses: actions/upload-artifact@v4
        if: ${{ success() && vars.USE_ARTIFACTS == '1' }}
        with:
          name: RunCore-xcframework
          path: ios/RunCore/RunCore.xcframework
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() && vars.USE_ARTIFACTS == '1' }}
        with:
          name: ios-smoke-screenshot
          path: build/ios-smoke/
          retention-days: 3
      - name: Error digest
        if: always()
        run: |
          python3 ios/tools/error_digest.py build/ios-logs/digest.txt \
            build/ios-logs/1-pub-get.log build/ios-logs/2-add-targets.log \
            build/ios-logs/1b-xcframework.log build/ios-logs/3-pod-install.log build/ios-logs/4-build.log build/ios-logs/4b-xctest.log build/ios-logs/5-dsym.log build/ios-logs/6-smoke.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() && vars.USE_ARTIFACTS == '1' }}
        with:
          name: ios-verify-digest
          path: build/ios-logs/digest.txt
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: ${{ always() && vars.USE_ARTIFACTS == '1' }}
        with:
          name: ios-verify-logs
          path: |
            build/ios-logs/
            ios/Podfile.lock
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: ${{ success() && vars.USE_ARTIFACTS == '1' }}
        with:
          name: ios-verify-dsyms
          path: build/ios-dsyms/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: ${{ success() && vars.USE_ARTIFACTS == '1' }}
        with:
          name: ios-simulator-app
          path: build/ios/iphonesimulator/Runner.app
          retention-days: 7
      - name: Publish the iOS evidence to a release (Actions artifact storage is exhausted)
        if: ${{ always() && vars.USE_ARTIFACTS != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out
          python3 - <<'PYCODE'
          import os, shutil
          def pack(name, sources):
              stage = f'ci-out/{name}'
              for src in sources:
                  if os.path.exists(src):
                      dst = os.path.join(stage, os.path.basename(src.rstrip('/')))
                      (shutil.copytree if os.path.isdir(src) else shutil.copy)(src, dst)
              if os.path.isdir(stage):
                  shutil.make_archive(f'ci-out/{name}', 'zip', stage)
          pack('ios-verify-logs', ['build/ios-smoke', 'build/ios-logs', 'ios/Podfile.lock'])
          pack('ios-verify-dsyms', ['build/ios-dsyms'])
          pack('RunCore-xcframework', ['ios/RunCore/RunCore.xcframework'])
          PYCODE
          if [ "${{ job.status }}" = "success" ] && [ -d build/ios/iphonesimulator/Runner.app ]; then
            (cd build/ios/iphonesimulator && zip -qr "$GITHUB_WORKSPACE/ci-out/ios-simulator-app.zip" Runner.app)
          fi
          tools/ci_release.sh put "ci-ios-${{ github.run_id }}" "ios ${{ github.run_id }}" "iOS simulator build evidence, run ${{ github.run_id }}, sha ${{ github.sha }}. Deleted after 3 days." ci-out/*.zip

  testflight-gate:
    # T4 skeleton (docs/RELEASE.md). UNTESTED: no Apple Developer account exists yet, so this has
    # never signed or uploaded anything. Runs on v* tags and on dispatch with `testflight` ticked.
    # A cheap Linux check first, so missing secrets never start a macOS runner.
    name: TestFlight secrets check
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.testflight) }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=TestFlight skipped::secrets not set:$missing (docs/RELEASE.md)"
            echo "### TestFlight skipped: secrets not set:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    # Release path decided in I0 (header above): config-only Flutter build, xcodebuild archive,
    # then -exportArchive with destination=upload. Automatic signing: the App Store Connect API key
    # (Admin role) lets Xcode create the cloud-managed distribution certificate and profiles.
    # Build number = this workflow's run_number + repo variable IOS_BUILD_NUMBER_OFFSET (default 0);
    # version = pubspec versionName (a v* tag must match it).
    name: TestFlight upload (UNTESTED)
    needs: [testflight-gate]
    if: ${{ needs.testflight-gate.outputs.ready == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Kotlin/Native toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-2.4.0 # bump with Kotlin in core-jvm/build.gradle.kts
      - name: Version and build number
        env:
          RUN_NUMBER: ${{ github.run_number }}
          BUILD_OFFSET: ${{ vars.IOS_BUILD_NUMBER_OFFSET || '0' }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          m = re.search(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+\s*$', Path('pubspec.yaml').read_text(), re.MULTILINE)
          if not m:
              raise SystemExit('pubspec.yaml needs version: MAJOR.MINOR.PATCH+build')
          version = m.group(1)
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != f'refs/tags/v{version}':
              raise SystemExit(f'{ref} does not match pubspec version v{version}')
          build = int(os.environ['RUN_NUMBER']) + int(os.environ['BUILD_OFFSET'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'IOS_VERSION={version}\nIOS_BUILD={build}\n')
          print(f'iOS {version} ({build}); ref {ref}')
          PYCODE
      - run: flutter pub get
      - name: Shared core XCFramework
        working-directory: android/core-jvm
        run: |
          ./gradlew assembleRunCoreReleaseXCFramework --no-daemon
          rm -rf ../../ios/RunCore && mkdir -p ../../ios/RunCore
          cp -R build/XCFrameworks/release/RunCore.xcframework ../../ios/RunCore/
      - name: Xcode project targets and pods
        run: |
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj --user-install
          ruby ios/tools/add_targets.rb
          (cd ios && pod install --repo-update)
      - name: App Store Connect API key to a temp file
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$(dirname "$key")"
          # Accept the .p8 as pasted PEM text or as base64 of the file.
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          fi
          grep -q 'BEGIN PRIVATE KEY' "$key" || { echo "::error::ASC_KEY_P8 is not a .p8 private key"; exit 1; }
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: flutter build ios --config-only (release)
        run: flutter build ios --release --config-only --build-name="$IOS_VERSION" --build-number="$IOS_BUILD"
      - name: xcodebuild archive (automatic signing via the API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p build/ios-logs
          xcodebuild archive -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic 2>&1 | tee build/ios-logs/archive.log
      - name: xcodebuild -exportArchive (destination upload = TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          plist="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string upload" -c "Add :signingStyle string automatic" \
            -c "Add :teamID string $APPLE_TEAM_ID" -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" "$plist" > /dev/null
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/ios-logs/export.log
          echo "### TestFlight: uploaded $IOS_VERSION ($IOS_BUILD); App Store Connect processing takes 10-30 min" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
      - name: Publish dSYMs and logs to a release
        if: ${{ always() && vars.USE_ARTIFACTS != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out
          [ -d "$RUNNER_TEMP/Runner.xcarchive/dSYMs" ] && (cd "$RUNNER_TEMP/Runner.xcarchive" && zip -qr "$GITHUB_WORKSPACE/ci-out/ios-release-dsyms.zip" dSYMs)
          [ -d build/ios-logs ] && (cd build && zip -qr "$GITHUB_WORKSPACE/ci-out/ios-release-logs.zip" ios-logs)
          ls ci-out/*.zip > /dev/null 2>&1 || exit 0
          tools/ci_release.sh put "ci-ios-${{ github.run_id }}" "ios ${{ github.run_id }}" "iOS release build, run ${{ github.run_id }}, sha ${{ github.sha }}." ci-out/*.zip
