name: companion-server

# Lightweight (ubuntu, no Flutter). Runs only when companion-server/**, coach/** (the skill the server compiles), assets/brand|fonts/** (the cards render them) or this file changes;
# the Flutter workflows ignore companion-server/** so a server-only PR costs one cheap job.
on:
  push:
    branches: [main]
    paths: ['companion-server/**', 'coach/**', 'assets/brand/**', 'assets/fonts/**', '.github/workflows/companion-server.yml']
  pull_request:
    paths: ['companion-server/**', 'coach/**', 'assets/brand/**', 'assets/fonts/**', '.github/workflows/companion-server.yml']

concurrency:
  group: companion-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # the ffmpeg apt step alone took ~10 min on 22-Oct and the 15 min cap cancelled runs
    permissions:
      contents: write  # only the failure step below publishes the rendered cards to a prerelease
    defaults:
      run:
        working-directory: companion-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: companion-server/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: ffmpeg (motion renders need it; fail the job if it cannot be had)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg); ffmpeg -version | head -1
      - name: Chromium for the card renderer
        run: python -m playwright install --with-deps chromium
      - name: Tests (card goldens must run, a missing renderer fails and never skips)
        env:
          RS_REQUIRE_RENDER: '1'
          RS_CHROMIUM_PATH: bundled
          RS_ACTUAL_DIR: ${{ runner.temp }}/card-actual
        run: python -m pytest -rs
      - name: Publish the rendered cards (regenerate goldens from these)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ls "$RUNNER_TEMP"/card-actual/*.png > /dev/null 2>&1; then
            ../tools/ci_release.sh put "card-goldens-pr-${{ github.event.pull_request.number }}" "Card renders PR ${{ github.event.pull_request.number }}" "CI card renders; copy over companion-server/tests/golden_cards/" --replace-assets "$RUNNER_TEMP"/card-actual/*.png
          fi
