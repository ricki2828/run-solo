name: companion-server

# Lightweight (ubuntu, no Flutter). Runs only when companion-server/** or this file changes;
# the Flutter workflows ignore companion-server/** so a server-only PR costs one cheap job.
on:
  push:
    branches: [main]
    paths: ['companion-server/**', '.github/workflows/companion-server.yml']
  pull_request:
    paths: ['companion-server/**', '.github/workflows/companion-server.yml']

concurrency:
  group: companion-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: companion-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: companion-server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
