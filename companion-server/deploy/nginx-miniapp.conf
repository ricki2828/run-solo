# Mini App (COMPANION_MINIAPP=1). For main to apply; nothing here has been installed.
#
# 1. http{} level (e.g. /etc/nginx/conf.d/companion-miniapp-limits.conf):
limit_req_zone $binary_remote_addr zone=miniapp:5m rate=20r/s;

# 2. In the companion.taiaroa.xyz server{} block, ABOVE `location / { return 404; }`:
location ^~ /miniapp/ {
    limit_req          zone=miniapp burst=40 nodelay;
    proxy_pass         http://127.0.0.1:8051;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    # Do not add CSP, Referrer-Policy or Cache-Control here: the app sets them (companion/miniapp.py CSP) and a second
    # header would fight it. The Authorization header carries initData; keep it out of any nginx log_format.
}
location = /miniapp { return 301 /miniapp/; }

# 3. If traffic goes through the Cloudflare tunnel (DEPLOY.md section 4), widen the ingress path from
#      path: ^/(v1|hooks)/
#    to
#      path: ^/(v1|hooks|miniapp)/
#    and add a Cloudflare rate-limit rule for /miniapp/api/ (60 requests per minute per IP).
#
# Content-Security-Policy the app sends on /miniapp/* (for review):
#   default-src 'none'; script-src 'self' https://telegram.org; style-src 'self'; font-src 'self'; img-src 'self' data:;
#   connect-src 'self'; base-uri 'none'; form-action 'none';
#   frame-ancestors https://web.telegram.org https://webk.telegram.org https://webz.telegram.org https://*.telegram.org
